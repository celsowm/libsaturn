name: distance-fade-verify

on:
  push:
    branches:
      - feat/distance-fade-3d
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host tests
        run: make test
      - name: Example C syntax
        run: gcc -std=gnu11 -Wall -Wextra -Iinclude -I. -fsyntax-only examples/distance_fade_3d/main.c
      - name: New C++ module syntax
        run: >-
          g++ -std=c++20 -Wall -Wextra -Iinclude -I. -fsyntax-only
          src/core/fade3d_api.cpp
          src/core/vdp1_color_calc_api.cpp
          src/core/vdp2_color_calc_api.cpp
          src/hal/vdp2_color_calc.cpp
