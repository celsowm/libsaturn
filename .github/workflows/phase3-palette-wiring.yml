name: Phase 3 palette ownership wiring

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/phase3-palette-wiring.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire palette ownership into runtime APIs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/core/vdp1_api.cpp')
          text = p.read_text()
          text = text.replace('#include "src/core/logic.hpp"\n', '#include "src/core/logic.hpp"\n#include "src/core/palette_registry.hpp"\n', 1)
          marker = '''    st = validate_indexed8_texture_dims(width, height);\n    if (st != SAT_OK) {\n        return st;\n    }\n\n    st = saturn::hal::vdp1::upload_palette(palette_rgb555, palette_index);'''
          replacement = '''    st = validate_indexed8_texture_dims(width, height);\n    if (st != SAT_OK) {\n        return st;\n    }\n    st = palette_claim_external(g_palette_registry, static_cast<uint16_t>(palette_index * 256u), 256u);\n    if (st != SAT_OK) {\n        return st;\n    }\n\n    st = saturn::hal::vdp1::upload_palette(palette_rgb555, palette_index);'''
          if marker not in text: raise SystemExit('combined VDP1 upload marker missing')
          text = text.replace(marker, replacement, 1)

          marker = '''    st = validate_palette_bank(palette_index);\n    if (st != SAT_OK) {\n        return st;\n    }\n    return saturn::hal::vdp1::upload_palette(palette_rgb555, palette_index);'''
          replacement = '''    st = validate_palette_bank(palette_index);\n    if (st != SAT_OK) {\n        return st;\n    }\n    st = palette_claim_external(g_palette_registry, static_cast<uint16_t>(palette_index * 256u), 256u);\n    if (st != SAT_OK) {\n        return st;\n    }\n    return saturn::hal::vdp1::upload_palette(palette_rgb555, palette_index);'''
          if marker not in text: raise SystemExit('VDP1 palette upload marker missing')
          text = text.replace(marker, replacement, 1)

          marker = '''    st = validate_indexed8_texture_dims(width, height);\n    if (st != SAT_OK) {\n        return st;\n    }\n\n    uint16_t srca = 0;'''
          replacement = '''    st = validate_indexed8_texture_dims(width, height);\n    if (st != SAT_OK) {\n        return st;\n    }\n    st = palette_claim_external(g_palette_registry, static_cast<uint16_t>(palette_index * 256u), 256u);\n    if (st != SAT_OK) {\n        return st;\n    }\n\n    uint16_t srca = 0;'''
          if marker not in text: raise SystemExit('VDP1 pixel-only upload marker missing')
          p.write_text(text.replace(marker, replacement, 1))

          p = Path('src/core/vdp2_api.cpp')
          text = p.read_text()
          text = text.replace('#include "src/core/logic.hpp"\n', '#include "src/core/logic.hpp"\n#include "src/core/palette_registry.hpp"\n', 1)
          marker = '''    st = validate_vdp2_palette_upload(count, offset);\n    if (st != SAT_OK) {\n        return st;\n    }\n\n    saturn::hal::vdp2::upload_palette(palette_rgb555, count, offset);'''
          replacement = '''    st = validate_vdp2_palette_upload(count, offset);\n    if (st != SAT_OK) {\n        return st;\n    }\n    st = palette_claim_external(g_palette_registry, offset, count);\n    if (st != SAT_OK) {\n        return st;\n    }\n\n    saturn::hal::vdp2::upload_palette(palette_rgb555, count, offset);'''
          if marker not in text: raise SystemExit('VDP2 palette marker missing')
          p.write_text(text.replace(marker, replacement, 1))

          p = Path('src/core/core_api.cpp')
          text = p.read_text()
          text = text.replace('#include "src/core/internal.hpp"\n', '#include "src/core/internal.hpp"\n#include "src/core/palette_registry.hpp"\n', 1)
          marker = '''    /* Initialize runtime state */\n    g_state.config = *config;'''
          replacement = '''    /* Reset shared runtime resource ownership before exposing initialized state. */\n    palette_registry_reset(g_palette_registry);\n\n    /* Initialize runtime state */\n    g_state.config = *config;'''
          if marker not in text: raise SystemExit('core init marker missing')
          p.write_text(text.replace(marker, replacement, 1))
          PY

      - name: Run host tests
        run: make test

      - name: Check patch hygiene
        run: git diff --check

      - name: Commit wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/core
          git commit -m 'runtime: track shared CRAM palette ownership'
          git push origin HEAD:main
