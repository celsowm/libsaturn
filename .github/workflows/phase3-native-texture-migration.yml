name: Phase 3 native texture migration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/phase3-native-texture-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Migrate repository-owned native texture call sites
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(grep -RIl \
            --include='*.c' \
            --include='*.cpp' \
            --include='*.hpp' \
            'sat_texture_t' src examples tests || true)
          if ((${#files[@]})); then
            perl -pi -e 's/\bsat_texture_t\b/sat_vdp1_texture_t/g' "${files[@]}"
          fi
          if grep -Rnw \
            --include='*.c' \
            --include='*.cpp' \
            --include='*.hpp' \
            'src' 'examples' 'tests' \
            -e 'sat_texture_t'; then
            echo 'legacy native texture name still present' >&2
            exit 1
          fi

      - name: Run host tests
        run: make test

      - name: Check patch hygiene
        run: git diff --check

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No migration changes required.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src examples tests
          git commit -m 'runtime: migrate native texture call sites'
          git push origin HEAD:main
