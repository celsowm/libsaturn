name: Phase 3 logical texture validation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/phase3-logical-texture.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire logical texture runtime
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/hal/vdp1.cpp')
          text = p.read_text()
          start = text.index('sat_result_t upload_texture_indexed8(')
          end = text.index('\n}  // namespace saturn::hal::vdp1', start)
          new = (
              'namespace {\n\n'
              'sat_result_t validate_indexed8_transfer(\n'
              '    const uint8_t* pixels, uint16_t width, uint16_t height, uint16_t pitch) {\n'
              '    if (pixels == nullptr || width == 0u || height == 0u || pitch < width || (width & 7u) != 0u) {\n'
              '        return SAT_ERR_INVALID_ARG;\n'
              '    }\n'
              '    if (width > 504u || height > 255u) return SAT_ERR_INVALID_ARG;\n'
              '    return SAT_OK;\n'
              '}\n\n'
              'void write_indexed8_rows(\n'
              '    uint32_t start, const uint8_t* pixels, uint16_t width, uint16_t height, uint16_t pitch) {\n'
              '    const uint32_t words_per_row = width / 2u;\n'
              '    const uint32_t first_word = start / 2u;\n'
              '    for (uint16_t y = 0u; y < height; ++y) {\n'
              '        const uint8_t* row = pixels + static_cast<uint32_t>(y) * pitch;\n'
              '        const uint32_t dst = first_word + static_cast<uint32_t>(y) * words_per_row;\n'
              '        for (uint32_t x = 0u; x < words_per_row; ++x) {\n'
              '            const uint16_t hi = row[x * 2u];\n'
              '            const uint16_t lo = row[x * 2u + 1u];\n'
              '            VDP1_VRAM_16[dst + x] = static_cast<uint16_t>((hi << 8u) | lo);\n'
              '        }\n'
              '    }\n'
              '}\n\n'
              '}  // namespace\n\n'
              'sat_result_t upload_texture_indexed8_pitched(\n'
              '    const uint8_t* pixels, uint16_t width, uint16_t height, uint16_t pitch, uint16_t* out_srca) {\n'
              '    if (out_srca == nullptr) return SAT_ERR_INVALID_ARG;\n'
              '    const sat_result_t st = validate_indexed8_transfer(pixels, width, height, pitch);\n'
              '    if (st != SAT_OK) return st;\n'
              '    const uint32_t size = static_cast<uint32_t>(width) * static_cast<uint32_t>(height);\n'
              '    g_texture_cursor = (g_texture_cursor + 7u) & ~7u;\n'
              '    if (g_texture_cursor + size > kVramSize) return SAT_ERR_CAPACITY;\n'
              '    const uint32_t start = g_texture_cursor;\n'
              '    write_indexed8_rows(start, pixels, width, height, pitch);\n'
              '    *out_srca = static_cast<uint16_t>(start >> 3u);\n'
              '    g_texture_cursor += size;\n'
              '    return SAT_OK;\n'
              '}\n\n'
              'sat_result_t upload_texture_indexed8(\n'
              '    const uint8_t* pixels, uint16_t width, uint16_t height, uint16_t* out_srca) {\n'
              '    return upload_texture_indexed8_pitched(pixels, width, height, width, out_srca);\n'
              '}\n\n'
              'sat_result_t update_texture_indexed8_pitched(\n'
              '    uint16_t srca, const uint8_t* pixels, uint16_t width, uint16_t height, uint16_t pitch) {\n'
              '    const sat_result_t st = validate_indexed8_transfer(pixels, width, height, pitch);\n'
              '    if (st != SAT_OK) return st;\n'
              '    const uint32_t start = static_cast<uint32_t>(srca) << 3u;\n'
              '    const uint32_t size = static_cast<uint32_t>(width) * static_cast<uint32_t>(height);\n'
              '    if (start < kTextureBase || start + size > g_texture_cursor || start + size > kVramSize) {\n'
              '        return SAT_ERR_INVALID_ARG;\n'
              '    }\n'
              '    write_indexed8_rows(start, pixels, width, height, pitch);\n'
              '    return SAT_OK;\n'
              '}\n'
          )
          p.write_text(text[:start] + new + text[end:])

          p = Path('src/core/core_api.cpp')
          text = p.read_text()
          if '#include "src/core/texture_runtime.hpp"' not in text:
              text = text.replace('#include "src/core/runtime_state.hpp"\n', '#include "src/core/runtime_state.hpp"\n#include "src/core/texture_runtime.hpp"\n', 1)
          marker = '    palette_registry_reset(g_palette_registry);\n'
          if marker not in text:
              raise SystemExit('palette registry reset marker missing')
          text = text.replace(marker, marker + '    texture_registry_reset(g_texture_registry);\n', 1)
          p.write_text(text)

          p = Path('Makefile')
          text = p.read_text()
          marker = 'HOST_TEST_EXTRA_test_vdp1_upload := src/core/vdp1_api.cpp src/core/runtime_state.cpp src/core/palette_registry.cpp\n'
          if marker not in text:
              raise SystemExit('host test linkage marker missing')
          extra = 'HOST_TEST_EXTRA_test_texture_api := src/core/texture_api.cpp src/core/runtime_state.cpp src/core/palette_registry.cpp src/core/texture_runtime.cpp\n'
          if extra not in text:
              text = text.replace(marker, marker + extra, 1)
          p.write_text(text)
          PY

      - name: Run host tests
        run: make test

      - name: Check patch hygiene
        run: git diff --check

      - name: Commit logical texture wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Makefile src/core src/hal
          git commit -m 'runtime: wire logical textures to VDP1 storage'
          git pull --rebase origin main
          git push origin HEAD:main
